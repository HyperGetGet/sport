<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Mon Sport</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#07080c;--card:rgba(255,255,255,.045);--card2:rgba(255,255,255,.075);--line:rgba(255,255,255,.09);--txt:#f4f5f8;--mut:#9097a6;
  --acc:#ff6a2b;--acc2:#ffb36b;--hot:#ff2e63;--vio:#9b5cff;--ok:#34d399;--warn:#fbbf24;--bad:#ff5a6e;--g:#5aa9ff;--d:#e58bff;
  --grad:linear-gradient(135deg,#ff8a2a 0%,#ff2e63 55%,#b23cff 100%);--grad2:linear-gradient(135deg,rgba(255,138,42,.22),rgba(255,46,99,.16) 55%,rgba(155,92,255,.18));
  --r:22px;--sh:0 10px 30px rgba(0,0,0,.35)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;color:var(--txt);font:16px/1.45 "Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;letter-spacing:-.005em;min-height:100vh;
  background:radial-gradient(900px 520px at 110% -10%,rgba(255,46,99,.20),transparent 60%),radial-gradient(700px 520px at -20% 10%,rgba(255,138,42,.16),transparent 60%),radial-gradient(800px 600px at 50% 120%,rgba(155,92,255,.14),transparent 60%),var(--bg);
  background-attachment:fixed;padding-bottom:calc(104px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;padding:calc(12px + env(safe-area-inset-top)) 18px 12px;display:flex;align-items:center;gap:10px;
  background:linear-gradient(180deg,rgba(7,8,12,.92),rgba(7,8,12,.55));backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
header h1{font-size:22px;margin:0;flex:1;font-weight:800;letter-spacing:-.02em;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.hbtn{background:var(--card);border:1px solid var(--line);color:var(--acc2);border-radius:14px;width:42px;height:40px;display:flex;align-items:center;justify-content:center;padding:0}
.hbtn.ok{color:var(--ok)}.hbtn.warn{color:var(--warn)}.hbtn.off{color:var(--mut)}.hbtn.bad{color:var(--bad)}
.hbtn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.chip{font-family:inherit;cursor:pointer;font-size:12px;font-weight:600;padding:9px 12px;border-radius:14px;background:var(--card);color:var(--mut);border:1px solid var(--line)}
main{padding:6px 16px 24px;max-width:720px;margin:0 auto}
nav{position:fixed;left:14px;right:14px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:6;max-width:560px;margin:0 auto;display:flex;padding:6px;
  background:rgba(20,22,30,.78);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:24px;box-shadow:0 12px 40px rgba(0,0,0,.5)}
nav button{flex:1;background:none;border:0;color:var(--mut);padding:9px 4px 8px;font:600 11px/1.2 inherit;display:flex;flex-direction:column;align-items:center;gap:4px;border-radius:18px;transition:all .2s}
nav button svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:#fff;background:var(--grad2)}
nav button.on svg{stroke:url(#ng)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin:0 0 14px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);animation:up .35s ease both}
.card.hero{position:relative;overflow:hidden;background:linear-gradient(160deg,rgba(255,138,42,.18),rgba(255,46,99,.12) 45%,rgba(155,92,255,.10)),rgba(255,255,255,.03);border:1px solid rgba(255,120,80,.35);box-shadow:var(--sh)}
.card.hero:after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(255,46,99,.35),transparent 70%);pointer-events:none}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.09em;color:var(--mut);margin:24px 4px 10px;font-weight:700}
h3{font-size:24px;margin:2px 0 2px;font-weight:800;letter-spacing:-.02em}
.mut{color:var(--mut)}.sm{font-size:13px}.xs{font-size:12px}
.row{display:flex;gap:10px;align-items:center}.row.wrap{flex-wrap:wrap}.grow{flex:1;min-width:0}
.btn{appearance:none;border:1px solid var(--line);background:var(--card2);color:var(--txt);border-radius:16px;padding:13px 16px;font:600 16px/1.2 inherit;min-height:50px;cursor:pointer;transition:transform .12s,filter .2s}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--grad);border:0;color:#fff;box-shadow:0 8px 24px rgba(255,46,99,.35);text-shadow:0 1px 2px rgba(0,0,0,.2)}
.btn.big{width:100%;min-height:64px;font-size:20px;font-weight:800;border-radius:20px;letter-spacing:-.01em}
.btn.ghost{background:none}.btn.sm{min-height:40px;padding:8px 13px;font-size:14px;border-radius:13px}
.btn.bad{color:var(--bad)}
.btns{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}.btns .btn{flex:1}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:5px 10px;border-radius:99px;background:var(--card2);color:var(--mut);margin-bottom:10px;letter-spacing:.03em;text-transform:uppercase}
.tag.late{background:rgba(251,191,36,.14);color:var(--warn)}.tag.today{background:var(--grad);color:#fff}.tag.ok{background:rgba(52,211,153,.14);color:var(--ok)}
.wk{display:flex;align-items:center;gap:16px}
.ring{position:relative;flex:0 0 auto}.ring svg{display:block;transform:rotate(-90deg)}.ring .in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring .in b{font-size:22px;font-weight:800;line-height:1}.ring .in span{font-size:11px;color:var(--mut)}
ul.blk{list-style:none;margin:12px 0 0;padding:0}ul.blk li{padding:10px 0;border-top:1px solid var(--line);font-size:14px;display:flex;gap:10px;align-items:center}
ul.blk li:first-child{border-top:0}
.mg{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:8px;vertical-align:middle;flex:0 0 auto}
label.f{display:block;font-size:13px;color:var(--mut);margin:12px 0 5px;font-weight:600}
input[type=number],input[type=text],input[type=date],select,textarea{width:100%;background:rgba(0,0,0,.35);color:var(--txt);border:1px solid var(--line);border-radius:14px;padding:12px 13px;font-size:16px;font-family:inherit}
input:focus,select:focus,textarea:focus{outline:0;border-color:rgba(255,120,80,.6);box-shadow:0 0 0 3px rgba(255,90,60,.15)}
textarea{min-height:80px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
input[type=range]{width:100%;accent-color:var(--acc);height:34px}
.pain{display:flex;align-items:center;gap:12px;margin:4px 0}.pain b{width:38px;text-align:center;font-size:22px;font-weight:800}
.seg{display:flex;gap:6px;flex-wrap:wrap;background:rgba(0,0,0,.25);padding:4px;border-radius:16px;border:1px solid var(--line)}
.seg button{flex:1;min-width:64px;background:none;border:0;color:var(--txt);padding:11px 6px;border-radius:12px;font:600 14px/1.25 inherit;transition:all .2s}
.seg button.on{background:var(--grad);color:#fff;box-shadow:0 4px 14px rgba(255,46,99,.3)}
.live{text-align:center}
.live .exo{font-size:30px;font-weight:800;line-height:1.1;margin:10px 0 6px;letter-spacing:-.02em}
.live .target{display:inline-block;font-size:19px;font-weight:800;margin:14px 0 4px;padding:8px 16px;border-radius:14px;background:var(--grad2);border:1px solid rgba(255,120,80,.3)}
.bar{height:6px;background:rgba(255,255,255,.08);border-radius:9px;overflow:hidden;margin-bottom:14px}.bar i{display:block;height:100%;background:var(--grad);border-radius:9px;transition:width .4s}
.step{display:flex;align-items:center;justify-content:center;gap:14px;margin:12px 0}
.step button{width:62px;height:62px;border-radius:50%;border:1px solid var(--line);background:var(--card2);color:var(--txt);font-size:30px;font-weight:600;transition:transform .1s}
.step button:active{transform:scale(.92);background:var(--grad2)}
.step .val{min-width:110px;font-size:40px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}.step .u{font-size:12px;color:var(--mut);display:block;font-weight:600;margin-top:-2px}
.timer{position:relative;width:230px;height:230px;margin:10px auto 6px}.timer svg{width:100%;height:100%;transform:rotate(-90deg)}
.timer .count{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;margin:0;font-size:60px}
.timer circle.trk{stroke:rgba(255,255,255,.07)}.timer circle.prg{transition:stroke-dashoffset .25s linear}
.count{font-size:84px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1;margin:18px 0 8px;letter-spacing:-.03em}
.count.end{color:var(--hot);animation:pulse .5s ease infinite alternate}
@keyframes pulse{to{transform:scale(1.06)}}
.note{background:rgba(0,0,0,.28);border-left:3px solid var(--hot);padding:10px 12px;border-radius:12px;font-size:14px;text-align:left;margin:12px 0;color:#dfe3ea}
.sheet{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);display:flex;align-items:flex-end;justify-content:center}
.sheet>div{background:#11131a;width:100%;max-width:720px;max-height:92vh;overflow:auto;border-radius:26px 26px 0 0;padding:20px 18px calc(24px + env(safe-area-inset-bottom));border:1px solid var(--line);animation:sh .25s ease}
@keyframes sh{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.toast{position:fixed;left:16px;right:16px;bottom:calc(100px + env(safe-area-inset-bottom));z-index:30;background:rgba(30,33,44,.95);backdrop-filter:blur(10px);border:1px solid var(--line);padding:13px 16px;border-radius:16px;font-size:14px;text-align:center;box-shadow:var(--sh)}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:7px 4px;border-top:1px solid var(--line);text-align:left}th{color:var(--mut);font-weight:600;border-top:0}
svg.ch{width:100%;height:auto;display:block}
.leg{display:flex;gap:14px;font-size:12px;color:var(--mut);margin-top:8px;flex-wrap:wrap}.leg i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}
.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.kpi div{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 8px;text-align:center}
.kpi b{display:block;font-size:26px;font-weight:800;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.thumbs div{position:relative}.thumbs img{width:74px;height:110px;object-fit:cover;border-radius:12px;border:1px solid var(--line);display:block}
.thumbs button{position:absolute;top:-6px;right:-6px;width:24px;height:24px;border-radius:50%;border:0;background:var(--bad);color:#fff;font-size:13px}
a{color:var(--acc2)}
</style>
</head>

<script>

const KEY='sport.v1';
const DAYS=['lundi','mardi','mercredi','jeudi','vendredi','samedi','dimanche'];
const MONTHS=['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
let S=null, tab='home', ui={}, tickId=null, audio=null, wake=null;

/* ---------- utilitaires ---------- */
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const iso=d=>new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10);
const today=()=>iso(new Date());
const pd=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return iso(d)};
const dow=s=>(pd(s).getDay()+6)%7+1;
const monday=s=>addDays(s,1-dow(s));
const diffDays=(a,b)=>Math.round((pd(a)-pd(b))/864e5);
const fmtDate=s=>{const d=pd(s);return DAYS[dow(s)-1]+' '+d.getDate()+' '+MONTHS[d.getMonth()]};
const fmtShort=s=>{const d=pd(s);return d.getDate()+' '+MONTHS[d.getMonth()]+' '+String(d.getFullYear()).slice(2)};
const fmtSec=n=>{n=Math.max(0,Math.round(n));const m=Math.floor(n/60),s=n%60;return m+':'+String(s).padStart(2,'0')};
const fmtDur=n=>n>=60?(Math.floor(n/60)+' min'+(n%60?' '+n%60+' s':'')):n+' s';
const r2=x=>Math.round(x*100)/100;
const fr=x=>String(r2(x)).replace('.',',');
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const clone=o=>JSON.parse(JSON.stringify(o));
const EX=id=>S.ex.find(e=>e.id===id);
const SES=id=>S.sessions.find(s=>s.id===id);
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),3200)}

/* ---------- stockage ---------- */
function freshState(){
  return {v:1,created:today(),planFrom:today(),ex:clone(SEED.ex),
    sessions:clone(SEED.sessions).map(s=>(s.fam=s.id.indexOf('haut')===0?'haut':'',s)),
    plan:[],gen:{},logs:[],weights:[],live:null,
    set:{beep:true,voice:false,vib:true,mode:'auto'}};
}
function load(){
  try{const raw=localStorage.getItem(KEY);S=raw?JSON.parse(raw):null}catch(e){S=null}
  if(!S||!S.ex){S=freshState();save()}
  if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
}
function save(local){ // local=true : enregistrement sur l'appareil sans le marquer « à envoyer »
  if(!local){S.updatedAt=Date.now();S.dirty=true}
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Sauvegarde impossible : stockage plein ou bloqué')}
  if(!local&&window.CLOUD)CLOUD.schedule();
}

/* ---------- planning ---------- */
function migrate(){
  if((S.mig||0)>=1)return;
  const N={haut1:['Pecs & Dos','Haut du corps · poussée et tirage'],haut2:['Bras & Épaules','Haut du corps · bras et épaules'],bas:['Jambes & Abdos','Bas du corps et gainage']};
  const OLD={haut1:'Haut 1',haut2:'Haut 2',bas:'Bas'};
  S.sessions.forEach(x=>{if(N[x.id]&&x.name===OLD[x.id]){x.name=N[x.id][0];x.sub=N[x.id][1]}});
  if(!EX('crunchsol'))S.ex.push({id:'crunchsol',name:'Crunch au sol',grp:'Abdos',type:'reps',min:15,max:30,step:2,inc:0,rest:30,load:0,target:15,k:0,knee:false,note:'Pieds au sol, genoux pliés. Monte en expirant, redescends lentement.',hist:'Crunch au sol'});
  const bas=SES('bas'); if(bas&&!bas.blocks.some(b=>b.ex.indexOf('crunchsol')>=0)){const gi=bas.blocks.findIndex(b=>b.ex.indexOf('gain')>=0);bas.blocks.splice(gi>=0?gi:bas.blocks.length,0,{alt:false,ex:['crunchsol'],sets:2,rest:30})}
  S.mig=1; save();
}
function ensurePlan(){
  const t=today(), w=monday(t);
  for(const s of S.sessions){
    if(!s.day)continue;
    const k=s.id+'|'+w; if(S.gen[k])continue;
    const d=addDays(w,s.day-1);
    S.gen[k]=1;
    if(d<S.planFrom)continue;
    if(S.plan.some(p=>p.sid===s.id&&p.status==='todo'))continue; // une séance en attente remplace celle de la semaine
    S.plan.push({id:uid(),sid:s.id,date:d,status:'todo'});
  }
  save(true); // identique sur chaque appareil : pas besoin de l'envoyer seul
}
function todos(){return S.plan.filter(p=>p.status==='todo'&&SES(p.sid)).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0)}
function upcomingVirtual(){ // aperçu de la semaine prochaine, non enregistré
  const w=addDays(monday(today()),7), out=[];
  for(const s of S.sessions){ if(!s.day)continue; if(S.plan.some(p=>p.sid===s.id&&p.status==='todo'))continue; out.push({sid:s.id,date:addDays(w,s.day-1),virtual:true}) }
  return out.sort((a,b)=>a.date<b.date?-1:1);
}
function resolvePlan(keepId){ // pas deux séances le même jour ; un jour d'écart entre deux séances de la même famille
  let moved=[];
  for(let n=0;n<12;n++){
    const L=todos(); let changed=false;
    for(let i=0;i<L.length;i++)for(let j=i+1;j<L.length;j++){
      let a=L[i],b=L[j]; const g=diffDays(b.date,a.date);
      const fa=SES(a.sid).fam,fb=SES(b.sid).fam; const need=(fa&&fa===fb)?2:1;
      if(g<need){ let mv=b; if(b.id===keepId&&a.id!==keepId&&g>=0&&a.date===b.date)mv=a;
        const other=mv===b?a:b; mv.date=addDays(other.date,need); moved.push(SES(mv.sid).name+' → '+fmtDate(mv.date)); changed=true; }
    }
    if(!changed)break;
  }
  return moved;
}
function weekDone(){const w=monday(today());return S.plan.filter(p=>p.status==='done'&&monday(p.doneOn)===w).length}
function streakWeeks(){ // semaines complètes d'affilée (hors semaine en cours)
  const n=S.sessions.filter(s=>s.day).length||1; let w=addDays(monday(today()),-7),c=0;
  for(;;){const k=S.plan.filter(p=>p.status==='done'&&monday(p.doneOn)===w).length; if(k>=n){c++;w=addDays(w,-7)}else break}
  return c;
}

/* ---------- progression (cycles du coach) ---------- */
function targetsFor(e,sets){
  if(e.type==='serie'){const a=[];for(let i=0;i<sets;i++)a.push(e.target+(i<(e.k||0)?1:0));return a}
  return Array(sets).fill(e.target);
}
function advance(e,vals,sets){ // vals : valeurs réalisées ; renvoie true si l'objectif est validé
  const tg=targetsFor(e,sets);
  const ok=vals.length>=sets&&tg.every((t,i)=>vals[i]>=t);
  if(!ok)return false;
  if(e.type==='serie'){
    e.k=(e.k||0)+1;
    if(e.k>=sets){e.k=0;e.target+=e.step; if(e.target>e.max){e.target=e.min;e.load=r2(e.load+e.inc)}}
  }else{
    const t=e.target+e.step;
    if(t>e.max){e.target=e.min;e.load=r2(e.load+e.inc)}else e.target=t;
  }
  return true;
}
function goalText(e,sets,load){
  const u=e.type==='time'?fmtDur:(x=>x+' rép.');
  const tg=targetsFor(e,sets); let t;
  if(tg.every(x=>x===tg[0]))t=sets+' × '+u(tg[0]);
  else{const hi=tg.filter(x=>x===tg[0]).length;t=hi+' × '+u(tg[0])+' + '+(sets-hi)+' × '+u(tg[sets-1])}
  const L=load==null?e.load:load;
  return t+(L>0?' à '+fr(L)+' kg':'');
}
const loadText=L=>L>0?fr(L)+' kg':'poids du corps';

/* ---------- séance en direct ---------- */
function buildSteps(s,o){
  const steps=[]; let blocks=s.blocks.filter(b=>o.long||!b.long);
  if(o.express)blocks=blocks.slice(0,1);
  blocks.forEach((b,bi)=>{
    const exs=b.ex.filter(id=>EX(id)); if(!exs.length)return;
    const order=[]; if(b.alt)for(let k=1;k<=b.sets;k++)exs.forEach(id=>order.push([id,k])); else exs.forEach(id=>{for(let k=1;k<=b.sets;k++)order.push([id,k])});
    order.forEach(([id,k])=>{const e=EX(id); const tg=targetsFor(e,b.sets)[k-1];
      const light=o.light&&e.knee; steps.push({ex:id,set:k,of:b.sets,rest:b.rest,target:tg,load:light?r2(Math.round(e.load*0.8*2)/2):e.load,light,alt:b.alt?exs.filter(x=>x!==id).map(x=>EX(x).name).join(', '):''})});
  });
  if(steps.length)steps[steps.length-1].rest=0;
  return steps;
}
function estMinutes(s,o){const st=buildSteps(s,o);let t=s.warm||0;st.forEach(x=>{const e=EX(x.ex);t+=(e.type==='time'?x.target:Math.min(90,Math.max(25,x.target*3)))+x.rest});return Math.round((t+st.length*8)/60)}
function startSession(sid,planId){
  const s=SES(sid); if(!s)return;
  ui.pre={sid,planId:planId||null,g:0,d:0,day:'normal',express:false,long:false,light:false,lightTouched:false};
  tab='home';render();
}
function beginLive(){
  const p=ui.pre,s=SES(p.sid); initAudio(); askWake(); keepAlive(true);
  try{if('Notification' in window&&Notification.permission==='default')Notification.requestPermission()}catch(e){}
  const steps=buildSteps(s,p); if(!steps.length){toast('Cette séance ne contient aucun exercice');return}
  S.live={sid:p.sid,planId:p.planId,express:p.express,long:p.long,light:p.light,steps,i:0,phase:s.warm?'warm':'work',until:s.warm?Date.now()+s.warm*1000:0,restTot:s.warm||0,
    start:Date.now(),done:[],diff:{},pain:{g:p.g,d:p.d,day:p.day},cur:null};
  ui.pre=null; primeCur(); save(); render(); startTick();
}
function primeCur(){const L=S.live; if(!L)return; const st=L.steps[L.i]; if(st)L.cur={val:st.target,load:st.load}}
function finishSet(){
  const L=S.live,st=L.steps[L.i]; stopChrono();
  L.done.push({ex:st.ex,set:st.set,val:L.cur.val,load:L.cur.load,target:st.target});
  const lastOfEx=!L.steps.slice(L.i+1).some(x=>x.ex===st.ex);
  L.askDiff=lastOfEx?st.ex:null;
  L.i++;
  if(L.i>=L.steps.length){L.phase='end';L.endAt=Date.now()}
  else if(st.rest>0){L.phase='rest';L.until=Date.now()+st.rest*1000;L.restTot=st.rest;L.beeped=6}
  else L.phase='work';
  primeCur(); save(); render();
}
function skipExercise(){
  const L=S.live,id=L.steps[L.i].ex; stopChrono();
  while(L.i<L.steps.length&&L.steps[L.i].ex===id)L.i++;
  // en alterné, on retire aussi les séries restantes de cet exercice plus loin
  L.steps=L.steps.filter((x,k)=>k<L.i||x.ex!==id);
  if(L.i>=L.steps.length){L.phase='end';L.endAt=Date.now()}else L.phase='work';
  primeCur();save();render();
}
function previewResult(){ // calcule, sans rien modifier, ce que la séance change aux objectifs
  const L=S.live,out=[],seen=[];
  L.steps.concat(L.done.map(d=>({ex:d.ex}))).forEach(x=>{if(seen.indexOf(x.ex)<0)seen.push(x.ex)});
  seen.forEach(id=>{const e=EX(id); if(!e)return; const planned=(buildSteps(SES(L.sid),L).filter(x=>x.ex===id)).length;
    const d=L.done.filter(x=>x.ex===id); if(!d.length)return;
    const c=clone(e); const light=L.light&&e.knee; let ok=false;
    if(!light){ if(d.every(x=>x.load===d[0].load))c.load=d[0].load; // charge réellement utilisée
      ok=advance(c,d.map(x=>x.val),planned); }
    out.push({id,name:e.name,done:d,planned,ok,light,next:goalText(c,planned),nextState:c});
  });
  return out;
}
function saveSession(){
  const L=S.live,res=previewResult(),dt=today();
  res.forEach(r=>{if(!r.light){const e=EX(r.id);e.target=r.nextState.target;e.load=r.nextState.load;e.k=r.nextState.k}});
  S.logs.push({id:uid(),date:dt,sid:L.sid,name:SES(L.sid).name,dur:Math.round(((L.endAt||Date.now())-L.start)/1000),express:L.express,light:L.light,
    pain:{g:L.pain.g,d:L.pain.d,day:L.pain.day,g2:ui.after?ui.after.g:null,d2:ui.after?ui.after.d:null},
    sets:L.done.map(d=>({ex:d.ex,set:d.set,val:d.val,load:d.load,target:d.target})),diff:L.diff,ok:res.filter(r=>r.ok).map(r=>r.id)});
  let p=L.planId&&S.plan.find(x=>x.id===L.planId);
  if(!p)p=S.plan.find(x=>x.sid===L.sid&&x.status==='todo');
  if(p){p.status='done';p.doneOn=dt}else S.plan.push({id:uid(),sid:L.sid,date:dt,status:'done',doneOn:dt});
  S.live=null;ui.after=null;stopTick();relWake();keepAlive(false);save();toast('Séance enregistrée');tab='home';render();
}
function abandon(){ if(!confirm('Arrêter la séance sans l\'enregistrer ?'))return; S.live=null;stopTick();stopChrono();relWake();keepAlive(false);save();render() }

/* ---------- minuteur, sons, écran allumé ---------- */
function initAudio(){try{if(!audio)audio=new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume()}catch(e){}}
function beep(f,ms){ if(!S.set.beep||!audio)return; try{const o=audio.createOscillator(),g=audio.createGain();o.frequency.value=f;o.connect(g);g.connect(audio.destination);
  const t=audio.currentTime;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.5,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+ms/1000);o.start(t);o.stop(t+ms/1000+.03)}catch(e){} }
function say(t){ if(!S.set.voice||!window.speechSynthesis)return; try{const u=new SpeechSynthesisUtterance(t);u.lang='fr-FR';u.rate=1.15;speechSynthesis.speak(u)}catch(e){} }
function buzz(p){ if(S.set.vib&&navigator.vibrate)try{navigator.vibrate(p)}catch(e){} }
async function askWake(){try{if('wakeLock' in navigator)wake=await navigator.wakeLock.request('screen')}catch(e){}}
let keep=null;
function keepAlive(on){ // garde la page active quand l'appli passe en arrière-plan pendant une séance
  if(on){ initAudio(); if(keep||!audio)return;
    try{const o=audio.createOscillator(),g=audio.createGain();o.frequency.value=35;g.gain.value=0.002;o.connect(g);g.connect(audio.destination);o.start();keep={o,g}}catch(e){}
    try{if('mediaSession' in navigator){navigator.mediaSession.metadata=new MediaMetadata({title:'Séance en cours',artist:'Mon Sport',artwork:[{src:'icon-512.png',sizes:'512x512',type:'image/png'}]});navigator.mediaSession.playbackState='playing'}}catch(e){}
  }else{ if(keep){try{keep.o.stop();keep.o.disconnect()}catch(e){}keep=null} try{if('mediaSession' in navigator)navigator.mediaSession.playbackState='none'}catch(e){} }
}
function notifyRestEnd(){
  if(!document.hidden||!('Notification' in window)||Notification.permission!=='granted'||!navigator.serviceWorker)return;
  const L=S.live,st=L&&L.steps[L.i],e=st&&EX(st.ex);
  navigator.serviceWorker.ready.then(r=>r.showNotification('C\'est reparti !',{body:e?e.name+' · série '+st.set+' sur '+st.of+(st.load>0?' · '+fr(st.load)+' kg':''):'Série suivante',tag:'repos',renotify:true,vibrate:[250,100,250],icon:'icon-192.png',badge:'icon-192.png'})).catch(()=>{});
}
function relWake(){try{if(wake)wake.release()}catch(e){}wake=null}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&S&&S.live){askWake();tick()}});
function startTick(){stopTick();tickId=setInterval(tick,250)}
function stopTick(){if(tickId)clearInterval(tickId);tickId=null}
function tick(){
  const L=S.live; if(!L)return stopTick();
  if(L.phase==='rest'||L.phase==='warm'){
    const left=Math.ceil((L.until-Date.now())/1000);
    const c=document.getElementById('cd'); if(c){c.textContent=fmtSec(left);c.classList.toggle('end',left<=5)}
    const tr=document.getElementById('tr'); if(tr){const C=+tr.dataset.c,T=+tr.dataset.t;tr.setAttribute('stroke-dashoffset',(C*(1-Math.max(0,(L.until-Date.now())/1000)/T)).toFixed(1))}
    if(L.phase==='rest'&&left<=5&&left>=1&&left<(L.beeped||6)){L.beeped=left;beep(880,130);say(String(left));buzz(60)}
    if(left<=0){beep(1320,480);buzz([180,80,180]);if(L.phase==='rest')say('C\'est parti');notifyRestEnd();L.phase='work';L.until=0;save();render()}
  }
  const el=document.getElementById('elapsed'); if(el)el.textContent=fmtSec((Date.now()-L.start)/1000);
  if(ui.chrono){const st=L.steps[L.i];const run=Math.floor((Date.now()-ui.chrono)/1000);const c=document.getElementById('chrono');
    if(c)c.textContent=fmtSec(run); if(st&&run>=st.target&&!ui.chronoDone){ui.chronoDone=true;beep(1320,480);buzz([200,80,200])} }
}
function stopChrono(){ if(ui.chrono&&S.live&&S.live.cur){const run=Math.floor((Date.now()-ui.chrono)/1000); if(run>2)S.live.cur.val=run} ui.chrono=null;ui.chronoDone=false }

/* ---------- données de suivi ---------- */
function lastPerf(e){
  for(let i=S.logs.length-1;i>=0;i--){const d=S.logs[i].sets.filter(x=>x.ex===e.id); if(d.length){
    const u=e.type==='time'?(x=>fmtDur(x)):(x=>x);return 'Dernière fois ('+fmtShort(S.logs[i].date)+') : '+d.map(x=>u(x.val)).join(' / ')+(d[0].load>0?' à '+fr(d[0].load)+' kg':'')}}
  const h=SEED.hist[e.hist]; if(h&&h.length){const x=h[h.length-1];return 'Avec ton coach ('+fmtShort(x[0])+') : '+x[1]+' × '+(x[4]==='s'?fmtDur(x[2]):x[2])+(x[3]>0?' à '+fr(x[3])+' kg':'')}
  return '';
}
function seriesFor(key){ // key = id d'exercice ou "h:nom" (archive coach)
  let e=null,hn=key; if(key.indexOf('h:')===0)hn=key.slice(2); else{e=EX(key);hn=e?e.hist:''}
  const coach=(SEED.hist[hn]||[]).map(x=>({d:x[0],sets:x[1],val:x[2],load:x[3],u:x[4],note:x[5]}));
  const mine=[]; if(e)S.logs.forEach(l=>{const d=l.sets.filter(x=>x.ex===e.id); if(d.length)mine.push({d:l.date,sets:d.length,val:Math.min.apply(null,d.map(x=>x.val)),load:Math.max.apply(null,d.map(x=>x.load)),u:e.type==='time'?'s':'r',note:l.diff?l.diff[e.id]:null})});
  return {coach,mine,time:(coach[0]||mine[0]||{u:e&&e.type==='time'?'s':'r'}).u==='s'};
}
function chart(series,o){ // series:[{c,pts:[[iso,val]]}]
  o=o||{}; const all=[].concat.apply([],series.map(s=>s.pts)); if(all.length<1)return '<p class="mut sm">Pas encore de données.</p>';
  const W=640,H=230,L=44,R=12,T=12,B=26; const ys=all.map(p=>p[1]);
  // axe horizontal par séance (et non par date) : la pause entre le coaching et la reprise n'écrase pas la courbe
  const dates=Array.from(new Set(all.map(p=>p[0]))).sort(),ix={}; dates.forEach((d,i)=>ix[d]=i);
  const x1=Math.max(1,dates.length-1); let y0=o.y0!=null?o.y0:Math.min.apply(null,ys),y1=o.y1!=null?o.y1:Math.max.apply(null,ys);
  if(y1===y0){y0-=1;y1+=1} const py=(y1-y0)*.08; if(o.y0==null)y0-=py; if(o.y1==null)y1+=py;
  const X=d=>L+ix[d]/x1*(W-L-R),Y=v=>T+(1-(v-y0)/(y1-y0))*(H-T-B);
  let g=''; for(let i=0;i<=3;i++){const v=y0+(y1-y0)*i/3,y=Y(v);g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'" stroke="#2e3743" stroke-width="1"/><text x="'+(L-6)+'" y="'+(y+4)+'" text-anchor="end" font-size="13" fill="#9aa6b5">'+fr(Math.round(v*10)/10)+'</text>'}
  g+='<text x="'+L+'" y="'+(H-6)+'" font-size="13" fill="#9aa6b5">'+fmtShort(dates[0])+'</text><text x="'+(W-R)+'" y="'+(H-6)+'" text-anchor="end" font-size="13" fill="#9aa6b5">'+fmtShort(dates[dates.length-1])+'</text>';
  series.forEach(s=>{ if(!s.pts.length)return; const P=s.pts.map(p=>[X(p[0]),Y(p[1])]);
    g+='<polyline fill="none" stroke="'+s.c+'" stroke-width="2.5" stroke-linejoin="round" points="'+P.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')+'"/>';
    P.forEach(p=>{g+='<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="3.2" fill="'+s.c+'"/>'}) });
  return '<svg class="ch" viewBox="0 0 '+W+' '+H+'" role="img">'+g+'</svg>';
}

  sheet('<h3>Reporter '+esc(SES(p.sid).name)+'</h3><p class="mut sm">La séance reste en attente, elle n\'est jamais perdue.</p><div class="btns" style="flex-direction:column"><button class="btn" data-a="doReport" data-d="'+addDays(t,1)+'">Demain ('+fmtDate(addDays(t,1))+')</button><button class="btn" data-a="doReport" data-d="'+addDays(t,2)+'">Après-demain ('+fmtDate(addDays(t,2))+')</button></div><label class="f">Ou un jour de ton choix</label><div class="row"><input type="date" id="rpD" min="'+t+'" value="'+addDays(t,3)+'"><button class="btn" data-a="doReportPick">Valider</button></div><div class="btns"><button class="btn sm ghost bad" data-a="skipPlan">Annuler cette séance</button><button class="btn sm ghost" data-a="closeSheet">Fermer</button></div>');
}
function exForm(e,isNew){

  return '<h3>'+(isNew?'Nouvel exercice':'Modifier l\'exercice')+'</h3><label class="f">Nom</label><input type="text" id="e_name" value="'+esc(e.name)+'"><div class="grid2"><div><label class="f">Groupe</label><input type="text" id="e_grp" value="'+esc(e.grp)+'"></div><div><label class="f">Type de cycle</label><select id="e_type">'+o('reps','Répétitions')+o('time','Durée (secondes)')+o('serie','Une série à la fois')+'</select></div></div>'+
  '<div class="grid3"><div><label class="f">Départ du cycle</label><input type="number" inputmode="numeric" id="e_min" value="'+e.min+'"></div><div><label class="f">Fin du cycle</label><input type="number" inputmode="numeric" id="e_max" value="'+e.max+'"></div><div><label class="f">Progression</label><input type="number" inputmode="numeric" id="e_step" value="'+e.step+'"></div></div>'+
  '<div class="grid3"><div><label class="f">Objectif actuel</label><input type="number" inputmode="numeric" id="e_target" value="'+e.target+'"></div><div><label class="f">Charge (kg)</label><input type="number" inputmode="decimal" step="0.25" id="e_load" value="'+e.load+'"></div><div><label class="f">Hausse (kg)</label><input type="number" inputmode="decimal" step="0.25" id="e_inc" value="'+e.inc+'"></div></div>'+
  '<p class="mut xs" style="margin:8px 0 0">'+(tm?'Valeurs en secondes. ':'')+'À chaque séance validée, l\'objectif augmente de la progression. Arrivé à la fin du cycle, il revient au départ et la charge monte de la hausse.</p>'+
  '<label class="f">Consigne affichée pendant la série</label><textarea id="e_note">'+esc(e.note||'')+'</textarea><label class="f">Exercice de jambes sensible pour les genoux</label><div class="seg"><button data-a="edKnee" data-v="1" class="'+(e.knee?'on':'')+'">Oui</button><button data-a="edKnee" data-v="0" class="'+(!e.knee?'on':'')+'">Non</button></div>'+
  '<div class="btns"><button class="btn pri" data-a="saveEx">Enregistrer</button><button class="btn" data-a="closeSheet">Annuler</button></div>'+(isNew?'':'<div class="btns"><button class="btn sm ghost bad" data-a="delEx">Supprimer cet exercice</button></div>');
}
function sesForm(){
  const s=ui.ed.s; const exOpt=(sel)=>S.ex.map(x=>'<option value="'+x.id+'"'+(x.id===sel?' selected':'')+'>'+esc(x.name)+'</option>').join('');
  let h='<h3>Modifier la séance</h3><div class="grid2"><div><label class="f">Nom</label><input type="text" data-i="sf" data-k="name" value="'+esc(s.name)+'"></div><div><label class="f">Sous-titre</label><input type="text" data-i="sf" data-k="sub" value="'+esc(s.sub)+'"></div></div><div class="grid2"><div><label class="f">Jour par défaut</label><select data-i="sf" data-k="day"><option value="0">Aucun</option>'+DAYS.map((d,i)=>'<option value="'+(i+1)+'"'+(s.day===i+1?' selected':'')+'>'+d+'</option>').join('')+'</select></div><div><label class="f">Échauffement (min)</label><input type="number" inputmode="numeric" data-i="sf" data-k="warm" value="'+Math.round((s.warm||0)/60)+'"></div></div>'+
   '<label class="f">Un jour d\'écart avec les autres séances du haut</label><div class="seg"><button data-a="sfFam" data-v="haut" class="'+(s.fam==='haut'?'on':'')+'">Oui</button><button data-a="sfFam" data-v="" class="'+(!s.fam?'on':'')+'">Non</button></div>';
  s.blocks.forEach((b,bi)=>{h+='<div class="card" style="margin-top:12px;background:var(--card2)"><div class="row"><b class="grow">Bloc '+(bi+1)+'</b><button class="btn sm ghost" data-a="blkUp" data-b="'+bi+'">↑</button><button class="btn sm ghost bad" data-a="blkDel" data-b="'+bi+'">Retirer</button></div>'+
    b.ex.map((id,xi)=>'<div class="row" style="margin-top:8px"><select data-i="bx" data-b="'+bi+'" data-x="'+xi+'">'+exOpt(id)+'</select>'+(b.ex.length>1?'<button class="btn sm ghost bad" data-a="bxDel" data-b="'+bi+'" data-x="'+xi+'">✕</button>':'')+'</div>').join('')+
    '<div class="btns" style="margin-top:8px"><button class="btn sm" data-a="bxAdd" data-b="'+bi+'">+ Exercice en alterné</button></div><div class="grid3"><div><label class="f">'+(b.ex.length>1?'Tours':'Séries')+'</label><input type="number" inputmode="numeric" data-i="bf" data-b="'+bi+'" data-k="sets" value="'+b.sets+'"></div><div><label class="f">Repos (s)</label><input type="number" inputmode="numeric" data-i="bf" data-b="'+bi+'" data-k="rest" value="'+b.rest+'"></div><div><label class="f">Version longue</label><select data-i="bf" data-b="'+bi+'" data-k="long"><option value="0">Non</option><option value="1"'+(b.long?' selected':'')+'>Oui</option></select></div></div></div>'});

  sheet(h);

/* ---------- boîte à idées (stockée à part, avec les captures) ---------- */
const IDB={db:null,
  open(){return new Promise((res,rej)=>{if(this.db)return res(this.db);const r=indexedDB.open('sport-ideas',1);r.onupgradeneeded=()=>r.result.createObjectStore('ideas',{keyPath:'id'});r.onsuccess=()=>{this.db=r.result;res(this.db)};r.onerror=()=>rej(r.error)})},
  run(mode,fn){return this.open().then(db=>new Promise((res,rej)=>{const q=fn(db.transaction('ideas',mode).objectStore('ideas'));q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)}))},
  all(){return this.run('readonly',st=>st.getAll())},put(o){return this.run('readwrite',st=>st.put(o))},del(id){return this.run('readwrite',st=>st.delete(id))}};
function loadIdeas(){return IDB.all().then(a=>{ui.ideas=a.sort((x,y)=>x.ts<y.ts?1:-1);if(tab==='set'&&!S.live&&!ui.pre&&!ui.idea)render()}).catch(()=>{ui.ideas=ui.ideas||[]})}
function seedIdeas(){ // idées déjà données à Claude, rangées d'office dans la boîte
  if(S.seedIdeas>=1)return Promise.resolve(); S.seedIdeas=1; save();
  return IDB.put({id:'seed-stats',ts:'2026-11-22T15:20:00',type:'idee',ctx:'Suivi',v:APP_V,screen:'',imgs:[],sent:true,
    text:'Statistiques personnelles : me situer en force par rapport à la moyenne des gens de ma tranche d\'âge et de ma catégorie de poids, à partir de mes charges. Saisie de mon poids semaine par semaine, avec la courbe.'});
}
function ctxNow(){ // où en est l'appli au moment où l'ampoule est touchée
  const L=S.live;
  if(ui.ed&&ui.ed.ex)return 'Programme › modification de l\'exercice « '+ui.ed.ex.name+' »';
  if(ui.ed&&ui.ed.s)return 'Programme › modification de la séance « '+ui.ed.s.name+' »';
  if(ui.rp&&document.getElementById('rpD'))return 'Accueil › report d\'une séance';
  if(ui.pre)return 'Avant la séance « '+SES(ui.pre.sid).name+' »';
  if(L){const st=L.steps[Math.min(L.i,L.steps.length-1)],e=st&&EX(st.ex),ph={warm:'échauffement',work:'série en cours',rest:'repos',end:'fin de séance'}[L.phase];
    return 'Séance en direct « '+SES(L.sid).name+' » › '+ph+(e&&(L.phase==='work'||L.phase==='rest')?' › '+e.name+', série '+st.set+' sur '+st.of:'')}
  if(tab==='stats')return 'Suivi › '+(EX(ui.sx)?EX(ui.sx).name:String(ui.sx||'').replace('h:',''));
  return {home:'Accueil',prog:'Programme',set:'Réglages'}[tab]||tab;
}
function ideaForm(){const d=ui.idea;
  sheet('<h3>Boîte à idées</h3><p class="mut sm" style="margin:2px 0 10px">Page notée automatiquement : <b>'+esc(d.ctx)+'</b></p><div class="seg"><button data-a="ideaType" data-v="bug" class="'+(d.type==='bug'?'on':'')+'">Bug</button><button data-a="ideaType" data-v="idee" class="'+(d.type==='idee'?'on':'')+'">Idée</button></div>'+
   '<label class="f">'+(d.type==='bug'?'Que s\'est-il passé ?':'Ton idée')+'</label><textarea id="ideaT" data-i="idea" placeholder="Écris ou dicte ici">'+esc(d.text)+'</textarea>'+
   '<div class="thumbs">'+d.imgs.map((u,i)=>'<div><img src="'+u+'" alt="Capture '+(i+1)+'"><button data-a="ideaImgDel" data-x="'+i+'" aria-label="Retirer">✕</button></div>').join('')+'</div>'+
   '<div class="btns"><button class="btn" data-a="ideaPick">+ Ajouter une capture d\'écran</button></div><input type="file" id="ideaF" accept="image/*" multiple style="display:none">'+
   '<div class="btns"><button class="btn pri" data-a="ideaSave">Enregistrer</button><button class="btn" data-a="ideaCancel">Annuler</button></div>');
}
function shrink(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file),im=new Image();im.onload=()=>{const k=Math.min(1,1400/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',.72))};im.onerror=()=>{URL.revokeObjectURL(u);rej()};im.src=u})}

/* ---------- actions ---------- */
const A={
  tab(d){tab=d.t;render();window.scrollTo(0,0)},
  start(d){initAudio();startSession(d.sid,d.pid)},
  preDay(d){ui.pre.day=d.v;render()},
  preFmt(d){ui.pre.express=d.v==='express';ui.pre.long=d.v==='long';render()},
  preLight(d){ui.pre.light=d.v==='1';ui.pre.lightTouched=true;render()},
  preCancel(){ui.pre=null;render()},
  begin(){beginLive()},
  setDone(){finishSet()},
  cur(d){const L=S.live;const v=parseFloat(d.v);L.cur[d.k]=Math.max(0,r2(L.cur[d.k]+v));save();document.getElementById('cv').textContent=L.cur.val;document.getElementById('cl').textContent=fr(L.cur.load)},
  chrono(){initAudio();if(ui.chrono){stopChrono();save()}else{ui.chrono=Date.now();ui.chronoDone=false}render()},
  restAdd(d){const L=S.live;L.until+=parseInt(d.v,10)*1000;L.restTot=Math.max(1,(L.restTot||0)+parseInt(d.v,10));if(L.until<Date.now())L.until=Date.now();L.beeped=6;save();tick()},
  restSkip(){const L=S.live;L.phase='work';L.until=0;save();render()},
  diff(d){S.live.diff[d.ex]=parseInt(d.v,10);save();render()},
  skipEx(){if(confirm('Passer cet exercice pour aujourd\'hui ?'))skipExercise()},
  endNow(){if(!confirm('Terminer la séance maintenant ?'))return;const L=S.live;stopChrono();L.phase='end';L.endAt=Date.now();L.askDiff=null;save();render()},
  abandon(){abandon()},
  saveSession(){saveSession()},
  saveNext(){const l=S.logs[S.logs.length-1];l.pain.g3=ui.next.g;l.pain.d3=ui.next.d;ui.next=null;save();toast('Noté');render()},
  report(d){openReport(d.pid)},
  doReport(d){const p=S.plan.find(x=>x.id===ui.rp);p.date=d.d;const mv=resolvePlan(p.id);save();closeSheet();toast('Reportée à '+fmtDate(p.date)+(mv.length?'. Décalé aussi : '+mv.join(', '):''));render()},
  doReportPick(){const v=document.getElementById('rpD').value;if(!v||v<today())return toast('Choisis une date à venir');A.doReport({d:v})},
  skipPlan(){if(!confirm('Annuler cette séance ?'))return;const p=S.plan.find(x=>x.id===ui.rp);p.status='skip';save();closeSheet();render()},
  closeSheet(){closeSheet()},
  closeSheetBg(d,el,ev){if(ev.target===el)closeSheet()},
  editEx(d){ui.ed={ex:clone(EX(d.id)),isNew:false};sheet(exForm(ui.ed.ex,false))},
  addEx(){ui.ed={ex:{id:'x'+uid(),name:'',grp:'',type:'reps',min:8,max:12,step:1,inc:1,rest:90,load:0,target:8,k:0,knee:false,note:'',hist:''},isNew:true};sheet(exForm(ui.ed.ex,true))},
  edKnee(d){readExForm();ui.ed.ex.knee=d.v==='1';sheet(exForm(ui.ed.ex,ui.ed.isNew))},
  saveEx(){readExForm();const e=ui.ed.ex;if(!e.name.trim())return toast('Donne un nom à l\'exercice');if(e.max<e.min)e.max=e.min;if(e.step<1)e.step=1;e.target=Math.min(Math.max(e.target,e.min),e.max);
    if(ui.ed.isNew){e.hist=e.name;S.ex.push(e)}else Object.assign(EX(e.id),e);save();closeSheet();render()},
  delEx(){const id=ui.ed.ex.id;if(!confirm('Supprimer cet exercice ? Il sera retiré des séances.'))return;S.ex=S.ex.filter(e=>e.id!==id);S.sessions.forEach(s=>{s.blocks.forEach(b=>b.ex=b.ex.filter(x=>x!==id));s.blocks=s.blocks.filter(b=>b.ex.length)});save();closeSheet();render()},
  editSes(d){ui.ed={s:clone(SES(d.sid))};sesForm()},
  addSes(){const s={id:'s'+uid(),name:'Nouvelle séance',sub:'',day:0,warm:300,fam:'',blocks:[{alt:false,ex:[S.ex[0].id],sets:3,rest:90}]};S.sessions.push(s);save();ui.ed={s:clone(s)};sesForm()},
  sfFam(d){ui.ed.s.fam=d.v;sesForm()},
  blkAdd(){ui.ed.s.blocks.push({alt:false,ex:[S.ex[0].id],sets:3,rest:90});sesForm()},
  blkDel(d){ui.ed.s.blocks.splice(+d.b,1);sesForm()},
  blkUp(d){const b=+d.b,B=ui.ed.s.blocks;if(b>0){const t=B[b-1];B[b-1]=B[b];B[b]=t;sesForm()}},
  bxAdd(d){const b=ui.ed.s.blocks[+d.b];b.ex.push(S.ex.find(e=>b.ex.indexOf(e.id)<0).id);b.alt=b.ex.length>1;sesForm()},
  bxDel(d){const b=ui.ed.s.blocks[+d.b];b.ex.splice(+d.x,1);b.alt=b.ex.length>1;sesForm()},
  saveSes(){const s=ui.ed.s;s.blocks=s.blocks.filter(b=>b.ex.length);Object.assign(SES(s.id),s);save();closeSheet();ensurePlan();render()},
  delSes(){const id=ui.ed.s.id;if(!confirm('Supprimer cette séance ?'))return;S.sessions=S.sessions.filter(s=>s.id!==id);S.plan=S.plan.filter(p=>p.sid!==id||p.status==='done');save();closeSheet();render()},
  addW(){const v=parseFloat(String(document.getElementById('wIn').value).replace(',','.'));if(!(v>30&&v<250))return toast('Poids non valide');S.weights=S.weights.filter(w=>w[0]!==today());S.weights.push([today(),v]);save();render()},
  delLog(d){if(!confirm('Supprimer cette séance du journal ? Les objectifs ne sont pas recalculés.'))return;S.logs=S.logs.filter(l=>l.id!==d.id);(S.delLogs=S.delLogs||[]).push(d.id);save();render()},
  setB(d){S.set[d.k]=d.v==='1';if(S.set[d.k]&&d.k==='beep'){initAudio();beep(880,130)}save();render()},
  setMode(d){S.set.mode=d.v;save();render()},
  idea(){const c=ctxNow();ui.ed=null;ui.idea={type:'bug',text:'',imgs:[],ctx:c};ideaForm()},
  ideaType(d){ui.idea.type=d.v;ideaForm()},
  ideaPick(){document.getElementById('ideaF').click()},
  ideaImgDel(d){ui.idea.imgs.splice(+d.x,1);ideaForm()},
  ideaCancel(){ui.idea=null;closeSheet()},
  ideaSave(){const d=ui.idea;if(!d.text.trim()&&!d.imgs.length)return toast('Écris un mot ou ajoute une capture');
    const o={id:uid(),ts:new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,19),type:d.type,text:d.text.trim(),ctx:d.ctx,v:APP_V,screen:innerWidth+'×'+innerHeight,imgs:d.imgs,sent:false};
    IDB.put(o).then(()=>{ui.idea=null;closeSheet();toast('Noté dans la boîte à idées');if(window.CLOUD)CLOUD.schedule(300);return loadIdeas()}).catch(()=>toast('Enregistrement impossible'))},
  ideaDel(d){if(!confirm('Supprimer cette note ?'))return;IDB.del(d.id).then(()=>{if(window.CLOUD)CLOUD.delIdea(d.id).catch(()=>{});return loadIdeas()})},
  ideaSend(){const I=ui.ideas||[];if(!I.length)return;const name='mon-sport-idees-'+today()+'.json',txt=JSON.stringify({app:'Mon Sport',version:APP_V,exporte:new Date().toISOString(),notes:I});
    const done=()=>Promise.all(I.filter(x=>!x.sent).map(x=>(x.sent=true,IDB.put(x)))).then(loadIdeas);
    let f=null;try{f=new File([txt],name,{type:'application/json'})}catch(e){}
    if(f&&navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f],title:'Boîte à idées Mon Sport'}).then(done).catch(()=>{})}
    else{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();a.remove();toast('Fichier téléchargé : envoie-le à Claude');done()}},
  cloudIn(){if(!window.CLOUD)return toast('Sauvegarde pas encore chargée');CLOUD.signIn().then(()=>toast('Connecté')).catch(e=>{const c=(e&&e.code)||'';if(c.indexOf('popup-closed')<0&&c.indexOf('cancelled')<0)toast('Connexion impossible : '+(e.message||c))})},
  cloudOut(){if(!confirm('Se déconnecter ? Tes données restent sur ce téléphone et dans le cloud.'))return;CLOUD.signOut()},
  cloudNow(){if(window.CLOUD)CLOUD.syncNow();else loadCloud()},
  cloudRetry(){loadCloud()},
  export(){const b=new Blob([JSON.stringify(S)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='mon-sport-'+today()+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)},
  import(){document.getElementById('impF').click()},
  reset(){if(confirm('Effacer toutes tes séances et revenir au programme de départ ?')&&confirm('Vraiment tout effacer ?')){S=freshState();save();ensurePlan();render()}}
};
function readExForm(){const e=ui.ed.ex,g=id=>document.getElementById(id),n=(id,d)=>{const v=parseFloat(String(g(id).value).replace(',','.'));return isNaN(v)?d:v};
  if(!g('e_name'))return; e.name=g('e_name').value;e.grp=g('e_grp').value;e.type=g('e_type').value;e.min=n('e_min',e.min);e.max=n('e_max',e.max);e.step=n('e_step',e.step);e.target=n('e_target',e.target);e.load=n('e_load',e.load);e.inc=n('e_inc',e.inc);e.note=g('e_note').value}
document.addEventListener('click',ev=>{const b=ev.target.closest('[data-a]');if(!b)return;const f=A[b.dataset.a];if(f)f(b.dataset,b,ev)});
document.addEventListener('input',ev=>{const t=ev.target,i=t.dataset&&t.dataset.i;if(!i)return;
  if(i==='idea'){ui.idea.text=t.value;return}
  if(i==='pain'){const o=t.dataset.k==='pre'?ui.pre:t.dataset.k==='after'?ui.after:ui.next;o[t.dataset.x]=parseInt(t.value,10);document.getElementById('pv-'+t.dataset.k+'-'+t.dataset.x).textContent=t.value}
  else if(i==='sf'){const s=ui.ed.s,k=t.dataset.k;s[k]=k==='day'?parseInt(t.value,10):k==='warm'?Math.max(0,parseInt(t.value,10)||0)*60:t.value}
  else if(i==='bf'){const b=ui.ed.s.blocks[+t.dataset.b],k=t.dataset.k;if(k==='long')b.long=t.value==='1';else b[k]=Math.max(k==='sets'?1:0,parseInt(t.value,10)||0)}
  else if(i==='bx'){ui.ed.s.blocks[+t.dataset.b].ex[+t.dataset.x]=t.value}
});
document.addEventListener('change',ev=>{const t=ev.target;
  if(t.dataset&&t.dataset.i==='sx'){ui.sx=t.value;render()}
  else if(t.dataset&&t.dataset.i==='pain'&&t.dataset.k==='pre')render();
  else if(t.id==='ideaF'&&t.files.length){Promise.all(Array.from(t.files).slice(0,6).map(f=>shrink(f).catch(()=>null))).then(a=>{a.filter(Boolean).forEach(u=>ui.idea.imgs.length<6&&ui.idea.imgs.push(u));ideaForm()})}
  else if(t.id==='impF'&&t.files[0]){const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(!o.ex||!o.sessions)throw 0;if(confirm('Remplacer toutes les données actuelles par cette sauvegarde ?')){S=o;save();render();toast('Sauvegarde restaurée')}}catch(e){toast('Fichier non reconnu')}};r.readAsText(t.files[0])}
});

/* ---------- démarrage ---------- */
const CLOUD_API={version:APP_V,
  get:()=>S, saveLocal:()=>save(true),
  replace:(o)=>{S=o;save(true);if(!S.live&&!ui.pre&&!ui.ed&&!ui.idea){ensurePlan();render()}},
  status:(st)=>{ui.cloud=st;renderCloud();if(!S.live&&!ui.pre&&!ui.ed&&!ui.idea&&(tab==='set'||tab==='home'))render()},
  weekKey:()=>monday(today()),
  ideas:{all:()=>IDB.all(),put:(o)=>IDB.put(o),reload:()=>loadIdeas()}};
